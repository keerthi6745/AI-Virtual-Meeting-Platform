<aside class="admin-sidebar" id="adminSidebar" aria-label="Admin navigation">
  <button type="button" class="admin-sidebar-close" onclick="closeAdminSidebar()" aria-label="Close navigation" aria-controls="adminSidebar">×</button>
  <a class="admin-sidebar-logo" href="{{ url_for('admin_dashboard') }}" aria-label="MeetIQ admin home"><span class="admin-logo-icon" aria-hidden="true">◇</span><span class="admin-logo-text">Meet<span>IQ</span></span></a>
  <div class="admin-sidebar-section-title">Workspace</div>
  <nav class="admin-sidebar-nav" aria-label="Admin menu">
    <a href="{{ url_for('admin_dashboard') }}" class="{% if request.endpoint == 'admin_dashboard' %}active{% endif %}" {% if request.endpoint == 'admin_dashboard' %}aria-current="page"{% endif %}><span class="admin-sidebar-icon" aria-hidden="true">⌂</span><span>Dashboard</span></a>
    <a href="{{ url_for('admin_meetings') }}" class="{% if request.endpoint in ['admin_meetings','create_meeting','meeting_details','edit_meeting'] %}active{% endif %}" {% if request.endpoint in ['admin_meetings','create_meeting','meeting_details','edit_meeting'] %}aria-current="page"{% endif %}><span class="admin-sidebar-icon" aria-hidden="true">▣</span><span>Meetings</span></a>
    <a href="{{ url_for('admin_ai_insights') }}" class="{% if request.endpoint == 'admin_ai_insights' %}active{% endif %}" {% if request.endpoint == 'admin_ai_insights' %}aria-current="page"{% endif %}><span class="admin-sidebar-icon" aria-hidden="true">✦</span><span>AI Insights</span></a>
    <a href="{{ url_for('admin_attendance') }}" class="{% if request.endpoint == 'admin_attendance' %}active{% endif %}" {% if request.endpoint == 'admin_attendance' %}aria-current="page"{% endif %}><span class="admin-sidebar-icon" aria-hidden="true">✓</span><span>Attendance</span></a>
  </nav>
  <div class="admin-sidebar-bottom">
    <a href="{{ url_for('logout') }}"><span class="admin-sidebar-icon" aria-hidden="true">↪</span><span>Sign out</span></a>
    <a href="{{ url_for('admin_profile') }}" class="{% if request.endpoint == 'admin_profile' %}active{% endif %}" {% if request.endpoint == 'admin_profile' %}aria-current="page"{% endif %}><span class="admin-sidebar-icon" aria-hidden="true">◉</span><span>My Profile</span></a>
  </div>
</aside>
<button type="button" class="admin-sidebar-open" onclick="openAdminSidebar()" aria-label="Open navigation" aria-controls="adminSidebar">☰</button>
<script>
  function closeAdminSidebar(){document.body.classList.add('admin-sidebar-closed')}
  function openAdminSidebar(){document.body.classList.remove('admin-sidebar-closed')}
  if (window.matchMedia('(max-width: 800px)').matches) closeAdminSidebar();
  window.addEventListener('resize', function () {
    if (window.matchMedia('(max-width: 800px)').matches) closeAdminSidebar();
  });
</script>
