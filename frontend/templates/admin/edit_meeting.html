<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MeetIQ - Edit Meeting</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='meetiq.css') }}">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family:
                Inter,
                Arial,
                sans-serif;

            background: #0b0d13;

            color: #f2f4f8;

            min-height: 100vh;
        }


        a {
            text-decoration: none;
            color: inherit;
        }


        .main {

            margin-left: 245px;

            min-height: 100vh;

            padding: 30px 35px 50px;
        }


        .topbar {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 30px;
        }


        .page-title {

            font-size: 28px;

            font-weight: 800;

            margin-bottom: 6px;
        }


        .page-subtitle {

            color: #747d92;

            font-size: 14px;
        }


        .back-button {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            padding: 10px 15px;

            border-radius: 9px;

            border: 1px solid
                rgba(255,255,255,0.08);

            background:
                rgba(255,255,255,0.04);

            color: #b7bdca;

            font-size: 13px;

            transition: 0.2s;
        }


        .back-button:hover {

            background:
                rgba(255,255,255,0.08);

            color: white;
        }


        .back-button svg {

            width: 16px;
        }


        .form-panel {

            max-width: 900px;

            background:
                rgba(255,255,255,0.035);

            border:
                1px solid rgba(255,255,255,0.07);

            border-radius: 18px;

            padding: 28px;
        }


        .form-grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;
        }


        .form-group {

            display: flex;

            flex-direction: column;

            gap: 8px;
        }


        .form-group.full {

            grid-column: 1 / -1;
        }


        label {

            color: #aeb5c5;

            font-size: 13px;

            font-weight: 600;
        }


        input,
        textarea,
        select {

            width: 100%;

            background: #141721;

            border:
                1px solid rgba(255,255,255,0.08);

            border-radius: 10px;

            padding: 12px 13px;

            color: #f2f4f8;

            font-family: inherit;

            font-size: 14px;

            outline: none;

            transition: 0.2s;
        }


        input:focus,
        textarea:focus,
        select:focus {

            border-color: #6c63ff;

            box-shadow:
                0 0 0 3px
                rgba(108,99,255,0.10);
        }


        textarea {

            min-height: 120px;

            resize: vertical;
        }


        select {

            cursor: pointer;
        }


        select option {

            background: #141721;

            color: white;
        }


        .form-actions {

            display: flex;

            justify-content: flex-end;

            gap: 12px;

            margin-top: 28px;

            padding-top: 22px;

            border-top:
                1px solid rgba(255,255,255,0.06);
        }


        .cancel-button,
        .save-button {

            padding: 11px 18px;

            border-radius: 9px;

            font-size: 13px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;
        }


        .cancel-button {

            background:
                rgba(255,255,255,0.04);

            border:
                1px solid rgba(255,255,255,0.08);

            color: #aeb5c5;
        }


        .cancel-button:hover {

            background:
                rgba(255,255,255,0.08);

            color: white;
        }


        .save-button {

            border: none;

            background:
                linear-gradient(
                    135deg,
                    #7168ff,
                    #4c8dff
                );

            color: white;
        }


        .save-button:hover {

            transform: translateY(-1px);

            box-shadow:
                0 8px 20px
                rgba(76,141,255,0.20);
        }


        @media (max-width: 900px) {

            .main {

                margin-left: 0;

                padding: 25px;
            }


            .form-grid {

                grid-template-columns: 1fr;
            }


            .form-group.full {

                grid-column: auto;
            }
        }


        @media (max-width: 600px) {

            .main {

                padding: 20px;
            }


            .topbar {

                align-items: flex-start;

                gap: 15px;
            }


            .page-title {

                font-size: 24px;
            }


            .form-panel {

                padding: 20px;
            }


            .form-actions {

                flex-direction: column;
            }


            .cancel-button,
            .save-button {

                width: 100%;

                text-align: center;
            }
        }

    </style>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
</head>


<body>


    <!-- ADMIN SIDEBAR -->

    {% include "admin/_sidebar.html" %}



    <main class="main">


        <!-- HEADER -->

        <div class="topbar">

            <div>

                <h1 class="page-title">
                    Edit Meeting
                </h1>

                <p class="page-subtitle">
                    Update the details of your meeting.
                </p>

            </div>


            <a
                href="{{ url_for(
                    'meeting_details',
                    meeting_id=meeting._id
                ) }}"
                class="back-button"
            >

                <svg
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                >

                    <path
                        d="M19 12H5"
                    />

                    <path
                        d="M12 19l-7-7 7-7"
                    />

                </svg>

                Back to Meeting

            </a>

        </div>



        <!-- FORM -->

        <div class="form-panel">


            <form
                method="POST"
                action="{{ url_for(
                    'edit_meeting',
                    meeting_id=meeting._id
                ) }}"
            >


                <div class="form-grid">


                    <!-- TITLE -->

                    <div class="form-group full">

                        <label for="title">
                            Meeting Title
                        </label>

                        <input
                            type="text"
                            id="title"
                            name="title"
                            value="{{ meeting.title }}"
                            placeholder="Enter meeting title"
                            required
                        >

                    </div>



                    <!-- DESCRIPTION -->

                    <div class="form-group full">

                        <label for="description">
                            Description
                        </label>

                        <textarea
                            id="description"
                            name="description"
                            placeholder="Enter meeting description"
                        >{{ meeting.description or "" }}</textarea>

                    </div>



                    <!-- DATE -->

                    <div class="form-group">

                        <label for="date">
                            Date
                        </label>

                        <input
                            type="date"
                            id="date"
                            name="date"
                            value="{{ meeting.date }}"
                            required
                        >

                    </div>



                    <!-- TIME -->

                    <div class="form-group">

                        <label for="time">
                            Time
                        </label>

                        <input
                            type="time"
                            id="time"
                            name="time"
                            value="{{ meeting.time }}"
                            required
                        >

                    </div>



                    <!-- DURATION -->

                    <div class="form-group">

                        <label for="duration">
                            Duration
                        </label>

                        <input
                            type="text"
                            id="duration"
                            name="duration"
                            value="{{ meeting.duration or '' }}"
                            placeholder="Example: 60 minutes"
                        >

                    </div>



                    <!-- MEETING TYPE -->

                    <div class="form-group">

                        <label for="meeting_type">
                            Meeting Type
                        </label>

                        <select
                            id="meeting_type"
                            name="meeting_type"
                        >

                            <option
                                value="Online"
                                {% if meeting.meeting_type == "Online" %}
                                    selected
                                {% endif %}
                            >
                                Online
                            </option>

                            <option
                                value="Interview"
                                {% if meeting.meeting_type == "Interview" %}
                                    selected
                                {% endif %}
                            >
                                Interview
                            </option>

                            <option
                                value="Class"
                                {% if meeting.meeting_type == "Class" %}
                                    selected
                                {% endif %}
                            >
                                Class
                            </option>

                            <option
                                value="Team Meeting"
                                {% if meeting.meeting_type == "Team Meeting" %}
                                    selected
                                {% endif %}
                            >
                                Team Meeting
                            </option>

                            <option
                                value="Other"
                                {% if meeting.meeting_type == "Other" %}
                                    selected
                                {% endif %}
                            >
                                Other
                            </option>

                        </select>

                    </div>



                    <!-- ACCESS -->

                    <div class="form-group">

                        <label for="access">
                            Access
                        </label>

                        <select
                            id="access"
                            name="access"
                        >

                            <option
                                value="Private"
                                {% if meeting.access == "Private" %}
                                    selected
                                {% endif %}
                            >
                                Private
                            </option>

                            <option
                                value="Restricted"
                                {% if meeting.access == "Restricted" %}
                                    selected
                                {% endif %}
                            >
                                Restricted
                            </option>

                            <option
                                value="Public"
                                {% if meeting.access == "Public" %}
                                    selected
                                {% endif %}
                            >
                                Public
                            </option>

                        </select>

                    </div>


                </div>



                <!-- ACTIONS -->

                <div class="form-actions">


                    <a
                        href="{{ url_for(
                            'meeting_details',
                            meeting_id=meeting._id
                        ) }}"
                        class="cancel-button"
                    >
                        Cancel
                    </a>


                    <button
                        type="submit"
                        class="save-button"
                    >
                        Save Changes
                    </button>


                </div>


            </form>


        </div>


    </main>


    <script src="{{ url_for('static', filename='js/meetiq.js') }}" defer></script>
</body>

</html>
